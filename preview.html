<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ваш бот — первая версия</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#20313d;font:16px system-ui}main{max-width:780px;margin:40px auto;padding:24px}h1{font-size:30px;margin:0 0 12px}p{line-height:1.6}.card{background:white;border-radius:22px;padding:24px;box-shadow:0 10px 40px #15314912}#chat{height:390px;overflow:auto;background:#e5eeea;border-radius:14px;padding:16px}.msg{white-space:pre-wrap;line-height:1.5;background:white;border-radius:14px;padding:13px 17px;margin:10px 0;max-width:92%}.user{background:#d1f5c3;margin-left:auto;width:fit-content}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button{background:#257eaf;color:white;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font:inherit}form{display:flex;gap:8px}input{min-width:0;flex:1;border:1px solid #c9d4db;border-radius:10px;padding:12px;font:inherit}.note{font-size:14px;color:#526875}</style><main><h1>Ваш помощник для клиентов</h1><p>Первая версия · Маникюр · Пятигорск</p><div class="card"><p class="note">Демонстрация на компьютере. Сообщения не отправляются в Telegram. Реальные контакты сюда вводить не нужно.</p><div id="chat" aria-live="polite"></div><div class="buttons"><button data-q="Свободные даты">Свободные даты</button><button data-q="Есть прайс?">Прайс</button><button data-q="Где вы находитесь?">Адрес</button><button data-q="Оставить контакты">Оставить контакты</button></div><form><input aria-label="Ваш вопрос" placeholder="Например: сколько стоит?" maxlength="500"><button>Отправить</button></form></div><p class="note">Для настоящего Telegram-бота откройте файл start.cmd в папке проекта. Инструкция — в README.md.</p></main><script>const faq={
  "dates": "Для записи доступны даты с 1 января по 1 апреля 2027 года, время — с 10:00 до 21:00. Чтобы согласовать конкретное время, нажмите «Оставить контакты». Заявка не означает подтверждённую запись.",
  "prices": "Наш прайс:\n• Наращивание до длины 3 включительно — 2 500 ₽.\n• Наращивание длины 4 — 2 800 ₽.\n• Наращивание большей длины — от 2 800 до 4 000 ₽, зависит от длины.\n• Коррекция гелем — 2 000 ₽.\n• Снятие материала — 500 ₽.\n• Дизайн одного ногтя — 50 ₽ (фольга, втирка, градиент, мрамор, поталь).",
  "address": "Наш адрес: г. Пятигорск, ул. Московская, 56.",
  "fallback": "Пока я умею отвечать только на эти вопросы: свободные даты, стоимость и адрес. Оставьте свои контакты, мы скоро свяжемся с Вами. Нажмите «Оставить контакты»: я спрошу имя, номер телефона и предпочтительный способ связи — звонок или сообщение (WhatsApp, Telegram)."
}
;const chat=document.querySelector('#chat');function add(t,user=false){const d=document.createElement('div');d.className='msg'+(user?' user':'');d.textContent=t;chat.append(d);chat.scrollTop=chat.scrollHeight}function ask(q){if(!q.trim())return;add(q,true);let t=q.toLowerCase().replaceAll('ё','е');if(t.includes('контакт'))add('В Telegram бот спросит: 1. Ваше имя. 2. Номер телефона. 3. Предпочтительный способ связи: звонок, WhatsApp или Telegram. После этого он отправит заявку мастеру. Здесь сбор контактов отключён.');else if(/цен|стоим|прайс|сколько|наращив|коррекц|сняти|дизайн/.test(t))add(faq.prices);else if(/адрес|находит|находят|где|добраться/.test(t))add(faq.address);else if(/дат|окош|окна|время|свобод|когда|запис/.test(t))add(faq.dates);else add(faq.fallback)}document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));document.querySelector('form').onsubmit=e=>{e.preventDefault();const i=document.querySelector('input');ask(i.value);i.value=''};add('Здравствуйте! Я помогу узнать свободные даты, цены и адрес. Выберите кнопку или напишите вопрос.');</script></html>
